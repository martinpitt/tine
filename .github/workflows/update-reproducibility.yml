# Accept updated digests from examples/image:reproducibility-test by amending
# the new checksums into the PR's topmost commit. Trigger this by adding the
# "update-reproducibility" label.
name: accept reproducibility digest changes

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: update-reproducibility-${{ github.event.pull_request.number }}

jobs:
  update:
    # does not work on a fork: we only get a read-only token for that
    if: github.event.label.name == 'update-reproducibility' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
    steps:
      # the commit CI ran on, rather than whatever the branch has moved on to since
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # refresh-expected runs in a box
      - name: GH runner setup
        uses: ./.github/actions/gh-runner-setup

      - name: Download the digests of the failed CI run
        run: |
          run=$(gh run list --workflow ci.yml --commit "$HEAD_SHA" --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
              echo "::error::no failed ci run for $HEAD_SHA"
              exit 1
          fi
          # one artifact per failed architecture
          gh run download "$run" --pattern 'reproducibility-*' --dir "$RUNNER_TEMP/digests"
          find "$RUNNER_TEMP/digests" -name 'actual.*.json' -exec mv --target-directory examples/image {} +

      - name: Accept the digests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'noreply@amutable.com'
          bin/tine buck run tine//examples/image:refresh-expected -- --amend

      - name: Update the branch
        run: git push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" origin "HEAD:refs/heads/$HEAD_REF"

      - name: Remove the label
        if: always()
        run: gh pr edit "$PULL_REQUEST" --remove-label update-reproducibility
